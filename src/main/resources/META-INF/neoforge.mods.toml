modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

# The Furnace, Smoker and Crude Blast Furnace (§15) -- the one place the mod mixes into a vanilla
# class rather than adding one. See feedback.mixins.json and mixin/AbstractFurnaceVesselMixin.
[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Rendering only, so the dedicated server neither needs it nor loads it. Required rather than
# optional on the client: without instancing a shaft run does not turn, and a factory that looks
# identical running and stopped is the one thing philosophy 8 cannot survive.
[[dependencies.${mod_id}]]
modId = "flywheel"
type = "required"
versionRange = "${flywheel_version_range}"
ordering = "AFTER"
side = "CLIENT"
